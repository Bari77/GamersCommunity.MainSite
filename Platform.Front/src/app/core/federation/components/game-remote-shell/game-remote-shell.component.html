@if (pending()) {
    <section class="game-remote-shell" aria-busy="true">
        <div class="game-remote-shell__hero">
            <gc-skeleton width="40%" height="2.5rem" />
            <gc-skeleton width="65%" height="1.1rem" />
            <gc-skeleton width="50%" height="1.1rem" />
        </div>
        <div class="game-remote-shell__grid">
            @for (card of cardPlaceholders; track card) {
                <div class="game-remote-shell__card">
                    <gc-skeleton width="100%" height="8rem" radius="0.75rem" />
                    <gc-skeleton width="70%" height="1rem" />
                    <gc-skeleton width="45%" height="0.85rem" />
                </div>
            }
        </div>
    </section>
}
<router-outlet (activate)="onChildActivated()" />
